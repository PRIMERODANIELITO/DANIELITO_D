<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronóstico del Tiempo - UNALM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
        }

        .h-screen { height: 100vh; }
        .w-screen { width: 100vw; }
        .h-full { height: 100%; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .flex-1 { flex: 1; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .gap-3 { gap: 0.75rem; }
        .grid { display: grid; }
        .grid-cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
        .grid-cols-12 { grid-template-columns: repeat(12, minmax(0, 1fr)); }
        .col-span-3 { grid-column: span 3 / span 3; }
        .col-span-9 { grid-column: span 9 / span 9; }
        .p-3 { padding: 0.75rem; }
        .p-4 { padding: 1rem; }
        .p-5 { padding: 1.25rem; }
        .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-3 { margin-bottom: 0.75rem; }
        .mr-1 { margin-right: 0.25rem; }
        .text-xs { font-size: 0.75rem; line-height: 1rem; }
        .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
        .text-base { font-size: 1rem; line-height: 1.5rem; }
        .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
        .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
        .text-2xl { font-size: 1.5rem; line-height: 2rem; }
        .text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
        .text-4xl { font-size: 2.25rem; line-height: 2.5rem; }
        .text-5xl { font-size: 3rem; line-height: 1; }
        .font-bold { font-weight: 700; }
        .font-semibold { font-weight: 600; }
        .text-white { color: white; }
        .text-center { text-align: center; }
        .rounded-xl { border-radius: 0.75rem; }
        .rounded-2xl { border-radius: 1rem; }
        .rounded-full { border-radius: 9999px; }
        .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
        .shadow-xl { box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); }
        .overflow-hidden { overflow: hidden; }
        .min-h-0 { min-height: 0; }
        .inline { display: inline; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
        .bottom-8 { bottom: 2rem; }
        .left-8 { left: 2rem; }
        .w-full { width: 100%; }
        .object-cover { object-fit: cover; }
        .hidden { display: none; }

        .bg-gradient {
            background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 50%, #06b6d4 100%);
        }

        .bg-glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .bg-glass-button {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .bg-glass-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .bg-glass-selected {
            background: rgba(255, 255, 255, 0.3);
        }

        .bg-glass-hover:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .bg-blue-badge {
            background: rgba(59, 130, 246, 0.5);
        }

        .bg-green-badge {
            background: rgba(34, 197, 94, 0.5);
        }

        .opacity-75 { opacity: 0.75; }
        .opacity-80 { opacity: 0.8; }
        .opacity-90 { opacity: 0.9; }

        .text-white-70 { color: rgba(255, 255, 255, 0.7); }
        .text-white-80 { color: rgba(255, 255, 255, 0.8); }

        .transition-all {
            transition-property: all;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 150ms;
        }

        .transform { transform: translateZ(0); }

        button {
            cursor: pointer;
            border: none;
            outline: none;
        }

        button:hover {
            transform: scale(1.05);
        }

        .day-card {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .day-card:hover {
            transform: scale(1.05);
        }

        .day-card.selected {
            transform: scale(1.05);
        }

        .drop-shadow-lg {
            filter: drop-shadow(0 10px 8px rgba(0, 0, 0, 0.04)) drop-shadow(0 4px 3px rgba(0, 0, 0, 0.1));
        }

        .text-blue-300 { color: #93c5fd; }
        .text-yellow-300 { color: #fde047; }

        .bg-gradient-overlay {
            background: linear-gradient(to top, rgba(30, 58, 138, 0.5), transparent);
        }

        .hourly-grid {
            height: calc(100% - 3rem);
        }

        svg {
            display: inline-block;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div id="app" class="h-screen w-screen bg-gradient p-4 overflow-hidden">
        <div class="h-full flex flex-col">
            <div class="text-white mb-3">
                <div class="flex justify-between items-center">
                    <div>
                        <h1 class="text-3xl font-bold">Pronóstico del Tiempo - UNALM</h1>
                        <p class="text-sm opacity-75" id="current-datetime"></p>
                    </div>
                    <button
                        id="toggle-view"
                        class="bg-glass-button px-6 py-2 rounded-xl font-semibold transition-all transform shadow-lg"
                    >
                        🌤️ Ver el Cielo
                    </button>
                </div>
            </div>

            <div id="sky-view" class="flex-1 bg-glass rounded-2xl shadow-xl overflow-hidden relative hidden">
                <div class="absolute inset-0 flex items-center justify-center">
                    <img 
                        src="https://images.unsplash.com/photo-1534088568595-a066f410bcda?w=1200&h=800&fit=crop" 
                        alt="Vista del cielo"
                        class="w-full h-full object-cover rounded-2xl"
                    />
                    <div class="absolute inset-0 bg-gradient-overlay"></div>
                    <div class="absolute bottom-8 left-8 text-white">
                        <h2 class="text-4xl font-bold mb-2">Vista en Tiempo Real</h2>
                        <p class="text-xl opacity-90">Condiciones actuales del cielo - UNALM</p>
                    </div>
                </div>
            </div>

            <div id="dashboard-view" class="flex-1 grid grid-cols-12 gap-3 min-h-0">
                <div class="col-span-3 flex flex-col gap-3">
                    <div class="bg-glass rounded-2xl p-5 shadow-xl flex-1 flex flex-col justify-center">
                        <div class="flex items-center justify-between mb-2">
                            <svg class="text-white" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"></path>
                            </svg>
                            <span class="text-white-70 text-xs font-semibold">TEMPERATURA</span>
                        </div>
                        <div class="text-white">
                            <div class="text-5xl font-bold" id="temp-value">24°</div>
                            <div class="text-lg opacity-80">Celsius</div>
                        </div>
                    </div>

                    <div class="bg-glass rounded-2xl p-5 shadow-xl flex-1 flex flex-col justify-center">
                        <div class="flex items-center justify-between mb-2">
                            <svg class="text-white" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                            </svg>
                            <span class="text-white-70 text-xs font-semibold">HUMEDAD</span>
                        </div>
                        <div class="text-white">
                            <div class="text-5xl font-bold" id="humidity-value">68%</div>
                            <div class="text-lg opacity-80">Relativa</div>
                        </div>
                    </div>

                    <div class="bg-glass rounded-2xl p-5 shadow-xl flex-1 flex flex-col justify-center">
                        <div class="flex items-center justify-between mb-2">
                            <svg class="text-white" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path>
                                <path d="M16 14v6m-4-6v6m-4-6v6"></path>
                            </svg>
                            <span class="text-white-70 text-xs font-semibold">PRECIPITACIÓN</span>
                        </div>
                        <div class="text-white">
                            <div class="text-5xl font-bold" id="precip-value">SÍ</div>
                            <div class="text-lg opacity-80" id="precip-prob">Prob. 75%</div>
                        </div>
                    </div>
                </div>

                <div class="col-span-9 flex flex-col gap-3">
                    <div class="bg-glass rounded-2xl p-4 shadow-xl">
                        <h2 class="text-white text-xl font-bold mb-3">Pronóstico Extendido</h2>
                        <div class="grid grid-cols-5 gap-3" id="forecast-days"></div>
                    </div>

                    <div class="bg-glass rounded-2xl p-4 shadow-xl flex-1">
                        <h2 class="text-white text-xl font-bold mb-3">Pronóstico por Hora - <span id="selected-day-name">Hoy</span></h2>
                        <div class="grid grid-cols-5 gap-3 hourly-grid" id="hourly-forecast"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const forecast = [
            {
                day: 'Hoy',
                date: 'Nov 15',
                temp: 24,
                humidity: 68,
                precipitation: true,
                precipProb: 75,
                icon: 'rain',
                hourly: [
                    { hour: '09:00', temp: 20, humidity: 72, precip: true },
                    { hour: '12:00', temp: 23, humidity: 70, precip: true },
                    { hour: '15:00', temp: 24, humidity: 68, precip: false },
                    { hour: '18:00', temp: 22, humidity: 73, precip: true },
                    { hour: '21:00', temp: 19, humidity: 78, precip: true },
                ]
            },
            {
                day: 'Mañana',
                date: 'Nov 16',
                temp: 26,
                humidity: 55,
                precipitation: false,
                precipProb: 20,
                icon: 'sun',
                hourly: [
                    { hour: '09:00', temp: 21, humidity: 60, precip: false },
                    { hour: '12:00', temp: 25, humidity: 56, precip: false },
                    { hour: '15:00', temp: 26, humidity: 55, precip: false },
                    { hour: '18:00', temp: 24, humidity: 58, precip: false },
                    { hour: '21:00', temp: 21, humidity: 62, precip: false },
                ]
            },
            {
                day: 'Dom',
                date: 'Nov 17',
                temp: 25,
                humidity: 62,
                precipitation: true,
                precipProb: 45,
                icon: 'cloudy',
                hourly: [
                    { hour: '09:00', temp: 21, humidity: 65, precip: false },
                    { hour: '12:00', temp: 24, humidity: 63, precip: true },
                    { hour: '15:00', temp: 25, humidity: 62, precip: true },
                    { hour: '18:00', temp: 23, humidity: 66, precip: false },
                    { hour: '21:00', temp: 20, humidity: 70, precip: false },
                ]
            },
            {
                day: 'Lun',
                date: 'Nov 18',
                temp: 27,
                humidity: 50,
                precipitation: false,
                precipProb: 10,
                icon: 'sun',
                hourly: [
                    { hour: '09:00', temp: 22, humidity: 55, precip: false },
                    { hour: '12:00', temp: 26, humidity: 51, precip: false },
                    { hour: '15:00', temp: 27, humidity: 50, precip: false },
                    { hour: '18:00', temp: 25, humidity: 53, precip: false },
                    { hour: '21:00', temp: 22, humidity: 58, precip: false },
                ]
            },
            {
                day: 'Mar',
                date: 'Nov 19',
                temp: 23,
                humidity: 70,
                precipitation: true,
                precipProb: 80,
                icon: 'rain',
                hourly: [
                    { hour: '09:00', temp: 20, humidity: 75, precip: true },
                    { hour: '12:00', temp: 22, humidity: 72, precip: true },
                    { hour: '15:00', temp: 23, humidity: 70, precip: true },
                    { hour: '18:00', temp: 21, humidity: 76, precip: true },
                    { hour: '21:00', temp: 19, humidity: 80, precip: true },
                ]
            },
        ];

        let selectedDay = 0;
        let showSky = false;

        function getWeatherIcon(icon, size = 36) {
            const icons = {
                sun: `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-white drop-shadow-lg"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>`,
                rain: `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-white drop-shadow-lg"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path><path d="M16 14v6m-4-6v6m-4-6v6"></path></svg>`,
                cloudy: `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-white drop-shadow-lg"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>`
            };
            return icons[icon] || icons.sun;
        }

        function updateDateTime() {
            const now = new Date();
            const options = { weekday: 'long', day: 'numeric', month: 'short' };
            const dateStr = now.toLocaleDateString('es-ES', options);
            const timeStr = now.toLocaleTimeString('es-ES');
            document.getElementById('current-datetime').textContent = `${dateStr} | ${timeStr}`;
        }

        function updateDashboard() {
            const selected = forecast[selectedDay];
            
            document.getElementById('temp-value').textContent = `${selected.temp}°`;
            document.getElementById('humidity-value').textContent = `${selected.humidity}%`;
            document.getElementById('precip-value').textContent = selected.precipitation ? 'SÍ' : 'NO';
            document.getElementById('precip-prob').textContent = `Prob. ${selected.precipProb}%`;
            document.getElementById('selected-day-name').textContent = selected.day;
            
            const forecastDays = document.getElementById('forecast-days');
            forecastDays.innerHTML = forecast.map((day, index) => `
                <button
                    onclick="selectDay(${index})"
                    class="day-card p-3 rounded-xl transition-all transform ${
                        selectedDay === index
                            ? 'bg-glass-selected shadow-xl selected'
                            : 'bg-glass bg-glass-hover'
                    }"
                >
                    <div class="text-white text-center">
                        <div class="font-bold text-base mb-1">${day.day}</div>
                        <div class="text-xs opacity-75 mb-2">${day.date}</div>
                        <div class="flex justify-center mb-2">${getWeatherIcon(day.icon, 36)}</div>
                        <div class="text-2xl font-bold mb-1">${day.temp}°</div>
                        <div class="text-xs opacity-80 mb-1">
                            <svg class="inline mr-1" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                            </svg>
                            ${day.humidity}%
                        </div>
                        <div class="text-xs font-semibold px-2 py-1 rounded-full ${
                            day.precipitation ? 'bg-blue-badge' : 'bg-green-badge'
                        }">
                            ${day.precipitation ? '🌧️' : '☀️'}
                        </div>
                    </div>
                </button>
            `).join('');
            
            const hourlyForecast = document.getElementById('hourly-forecast');
            hourlyForecast.innerHTML = selected.hourly.map(hour => `
                <div class="bg-glass rounded-xl p-3 text-center flex flex-col justify-center">
                    <div class="text-white font-semibold mb-2 text-sm">${hour.hour}</div>
                    <div class="flex justify-center mb-2">
                        ${hour.precip 
                            ? '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-blue-300"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path><path d="M16 14v6m-4-6v6m-4-6v6"></path></svg>'
                            : '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-yellow-300"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>'
                        }
                    </div>
                    <div class="text-white text-2xl font-bold mb-1">${hour.temp}°</div>
                    <div class="text-white-80 text-xs flex items-center justify-center">
                        <svg class="mr-1" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                        </svg>
                        ${hour.humidity}%
                    </div>
                </div>
            `).join('');
        }

        function selectDay(index) {
            selectedDay = index;
            updateDashboard();
        }

        function toggleView() {
            showSky = !showSky;
            const skyView = document.getElementById('sky-view');
            const dashboardView = document.getElementById('dashboard-view');
            const toggleBtn = document.getElementById('toggle-view');
            
            if (showSky) {
                skyView.classList.remove('hidden');
                dashboardView.classList.add('hidden');
                toggleBtn.textContent = '📊 Ver Dashboard';
            } else {
                skyView.classList.add('hidden');
                dashboardView.classList.remove('hidden');
                toggleBtn.textContent = '🌤️ Ver el Cielo';
            }
        }

        document.getElementById('toggle-view').addEventListener('click', toggleView);

        updateDateTime();
        setInterval(updateDateTime, 1000);
        updateDashboard();
    </script>
</body>
</html>
